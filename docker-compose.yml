services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediflow-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mediflow_user:mediflow_pass@db:5432/mediflow_db?schema=public
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: mediflow-postgres
    restart: always
    environment:
      POSTGRES_USER: mediflow_user
      POSTGRES_PASSWORD: mediflow_pass
      POSTGRES_DB: mediflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
